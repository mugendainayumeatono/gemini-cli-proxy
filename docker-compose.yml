services:
  gemini-proxy:
    build: .
    image: gemini-cli-proxy:latest
    container_name: gemini-cli-proxy
    stdin_open: true
    tty: true

    volumes:
      - ./src:/app/src
      - ./policies:/app/policies
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./README.md:/app/README.md
      # 持久化配置 (允许通过 HOST_CONFIG_DIR 环境变量指定宿主机目录，默认 ./.gemini)
      - ${HOST_CONFIG_DIR:-./.gemini}:/root/.gemini
      # 持久化日志到本地 logs 目录
      - ./logs:/app/logs
      # 挂载本地入口脚本，使修改直接生效，无需重新构建镜像
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PROXY_API_KEY=${PROXY_API_KEY:-sk-proxy-920cd156c9ec2f2616385cf7b7b5efe7}
      - USE_NO_TOOLS_POLICY=true
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped

# volumes:
#   gemini-config:

networks:
  default:
    name: gemini-proxy-network
